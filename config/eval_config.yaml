
metadata:
  project: "PatRe"
  ipc_categories: ["A", "B", "C", "D", "E", "F", "G", "H"]

# task_settings
task_settings:
  # current_task: "rebuttal"
  current_task: "oa"
  num_samples: 100000
  # After each patent: flush output/ai_output.txt (and siblings) for crash-safe resume
  incremental_disk_save: true
  auto_run_extra_metrics: true
  similarity_metrics:
    bleu: false
    rouge_l: true
    bert_score: false
  # Token-only prompt limits (char limits are disabled below).
  judge_max_tokens: 0
  judge_default_field_max_tokens: 0
  # Generation-side reference packing uses judge_field_max_chars.reference_summaries
  # as a token-limit proxy; set it huge to keep truncation code "on"
  # but effectively non-binding.
  judge_field_max_chars:
    reference_summaries: 5000000
  judge_max_chars: 0
  judge_default_field_max_chars: 0


experiment_matrix: 
  test_modes:  
    - "zero_shot"      
    - "sft_model"      
  retrieval_settings:
    - "no_ref"         
    - "oracle_summary" 
    - "bm25_retrieved"
  granularities:
    - "full_text"      
    - "atomic_claim"   


models:
  backbone_list:
    - "gpt-4o-mini"
    # - "arcee-ai/trinity-large-preview:free"
    # - "tngtech/deepseek-r1t2-chimera:free"
    # - "llama3.1"
    # - "phi4-mini"
    # - "gpt-4o"
    # - "deepseek-v3"
    # - "deepseek-r1"
    # - "qwen-2.5-7b-instruct"

  judge_model: "gemini-3.1-flash-lite-preview"

  # API keys / endpoints should be provided via .env (preferred).
  backend: "api"
  judge_backend: "api"  
  generation_params:
    temperature: 0.0
    top_p: 1.0
    max_tokens: 16384
  sft_model_id: ""

# Current Run Settings
active_settings:
  test_mode: "zero_shot"
  retrieval_setting: "oracle_summary" 
  oa_prompt_variant: "retrieval_aligned"
  granularity: "full_text"


paths:
  test_set: "dataset/processed/test_set_new.json"
  prompt_path: "config/prompt_templates.json"
  results: "results/"
  reference_pool: "dataset/ReferencePool_Full"


experiment_naming:
  use_academic_format: true
  include_model_name: true
  timestamp_format: "%Y%m%d_%H%M"
retrieval_params:
  bm25_top_k: 5
