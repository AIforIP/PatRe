
metadata:
  project: "PatRe"
  ipc_categories: ["A", "B", "C", "D", "E", "F", "G", "H"]

# task_settings
task_settings:
  # current_task: "rebuttal"
  current_task: "oa"
  num_samples: 100000
  auto_run_extra_metrics: true
  similarity_metrics:
    bleu: true
    rouge_l: true
    bert_score: true
  judge_max_chars: 12000
  judge_default_field_max_chars: 4000
  judge_field_max_chars:
    generated_text: 40000
    ground_truth: 40000
    office_action: 30000
    claims: 70000
    reference_summaries: 20000


experiment_matrix: 
  test_modes:  
    - "zero_shot"      
    - "sft_model"      
  retrieval_settings:
    - "no_ref"         
    - "oracle_summary" 
    - "bm25_retrieved"
  granularities:
    - "full_text"      
    - "atomic_claim"   


models:
  backbone_list:
    - "gpt-4o-mini"
    # - "arcee-ai/trinity-large-preview:free"
    # - "tngtech/deepseek-r1t2-chimera:free"
    # - "llama3.1"
    # - "phi4-mini"
    # - "gpt-4o"
    # - "deepseek-v3"
    # - "deepseek-r1"
    # - "qwen-2.5-7b-instruct"

  judge_model: "gemini-3.1-flash-lite-preview"

  api_key: "EMPTY"
  base_url: "https://api.chatanywhere.tech/v1"
  judge_api_key: ""
  judge_base_url: "https://api.chatanywhere.tech/v1"
  backend: "api"
  judge_backend: "api"  
  ollama_base_url: "http://localhost:11434/v1" 
  ollama_api_key: "ollama"  
  vllm_base_url: "http://localhost:8000/v1"
  vllm_api_key: "EMPTY"
  generation_params:
    temperature: 0.0
    top_p: 1.0
    max_tokens: 16384
  sft_model_id: ""

# Current Run Settings
active_settings:
  test_mode: "zero_shot"
  retrieval_setting: "oracle_summary" 
  oa_prompt_variant: "retrieval_aligned"
  granularity: "full_text"


paths:
  test_set: "dataset/processed/test_set_new.jsonl"
  prompt_path: "config/prompt_templates.json"
  results: "results/"
  reference_pool: "dataset/ReferencePool_Full"


experiment_naming:
  use_academic_format: true
  include_model_name: true
  timestamp_format: "%Y%m%d_%H%M"
retrieval_params:
  bm25_top_k: 5
